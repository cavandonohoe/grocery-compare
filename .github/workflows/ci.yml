name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # pnpm avoids the npm reify hang (npm/cli#9386) that made npm ci
        # deadlock and crash with "Exit handler never called!" on the runner.
        # TODO: switch to --frozen-lockfile once pnpm-lock.yaml is committed.
        run: pnpm install --no-frozen-lockfile

      - name: Upload generated lockfile
        # TEMPORARY: lets us commit the pnpm-lock.yaml generated on the runner
        # (local lockfile generation is blocked by a TLS-inspecting proxy).
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
