name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm ci hard-hangs on this dependency tree on the Linux runner:
        # reification never settles, and even SIGKILL-timeout retries of
        # npm ci never complete. npm install uses a different install path
        # that does settle (verified locally). --ignore-scripts skips the
        # local-only prepare hook (git hooksPath), which is a no-op in CI.
        run: |
          for attempt in 1 2; do
            echo "npm install attempt $attempt"
            if timeout -s KILL 300 npm install --no-audit --no-fund --ignore-scripts; then
              exit 0
            fi
            echo "npm install attempt $attempt failed; cleaning and retrying"
            rm -rf node_modules
          done
          echo "npm install failed after 2 attempts"
          exit 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
