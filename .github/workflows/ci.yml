name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm ci can hang forever and then crash with
        # "Exit handler never called!" (npm/cli#9386). The root cause is an
        # agent-base bug: with more dependencies than maxsockets (default 15),
        # any single failed/slow tarball fetch strands the queued fetches, so
        # the install never settles. Raising maxsockets above the dependency
        # count removes the agent queue entirely, so fetches resolve (or fail)
        # fast instead of hanging. timeout -s KILL force-kills a genuine hang
        # (plain SIGTERM is ignored in the stuck state), and we retry once.
        run: |
          for attempt in 1 2; do
            echo "npm ci attempt $attempt"
            if timeout -s KILL 300 npm ci --no-audit --no-fund --maxsockets 1000; then
              exit 0
            fi
            echo "npm ci attempt $attempt failed; cleaning and retrying"
            rm -rf node_modules
          done
          echo "npm ci failed after 2 attempts"
          exit 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
