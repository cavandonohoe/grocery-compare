name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm ci intermittently crashes on the runner with
        # "Exit handler never called!" while reifying the vitest/rollup
        # optional native binaries. Retry a couple of times with a hard
        # timeout so a stuck install fails fast instead of hanging ~8 min.
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt"
            if timeout 240 npm ci --no-audit --no-fund; then
              exit 0
            fi
            echo "npm ci attempt $attempt failed; cleaning and retrying"
            rm -rf node_modules
            npm cache verify || true
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
